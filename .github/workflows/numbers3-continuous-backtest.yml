name: NUMBERS3 Continuous Evolution

on:
  push:
    branches: [main]
    paths:
      - numbers3_evolution_engine.py
      - numbers3_evolution_feedback.py
      - numbers3_champion_replay.py
      - numbers3_champion.py
      - numbers3_runner_champion.py
      - numbers3_evo_agent.py
      - .github/workflows/numbers3-continuous-backtest.yml
  workflow_dispatch:
  schedule:
    # Watchdog: restart the chain every 6 hours if a transient failure stopped it.
    - cron: "17 */6 * * *"

concurrency:
  group: numbers3-continuous-backtest
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  continuous-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure agent git identity
        run: |
          git config user.name "numbers3-ai-agent"
          git config user.email "numbers3-ai-agent@users.noreply.github.com"

      - name: Run Champion Challenger experiments continuously
        env:
          TZ: Asia/Tokyo
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          DEADLINE=$(( $(date +%s) + 19800 ))
          LAST_CHECKPOINT=$(date +%s)
          CYCLES_THIS_RUN=0
          PROMOTION_PENDING=0

          restore_dataset() {
            cat data/history_parts/part_* > /tmp/numbers3.csv.xz.b64
            base64 -d /tmp/numbers3.csv.xz.b64 > /tmp/numbers3.csv.xz
            xz -dc /tmp/numbers3.csv.xz > data/numbers3.csv
          }

          champion_id() {
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("state/evolution_champion.json")
          print(json.loads(p.read_text(encoding="utf-8")).get("champion_id", ""))
          PY
          }

          replay_latest_champion() {
            echo "[replay] checking latest Champion against all historical draws"
            python numbers3_champion_replay.py \
              --csv data/numbers3.csv \
              --champion state/evolution_champion.json \
              --state state/champion_replay_state.json \
              --output-dir backtests/champion_replay \
              --warmup 500 \
              --refit-interval 500 \
              --audit-draws 1000
          }

          update_compatibility_status() {
            cp experiments/latest_experiment.txt backtests/continuous_status.txt
            python - <<'PY'
          import json
          import re
          import pandas as pd
          from pathlib import Path

          old_path = Path("state/continuous_backtest_state.json")
          engine_path = Path("state/evolution_engine_state.json")
          champion_path = Path("state/evolution_champion.json")
          replay_path = Path("state/champion_replay_state.json")
          old = json.loads(old_path.read_text(encoding="utf-8")) if old_path.exists() else {}
          eng = json.loads(engine_path.read_text(encoding="utf-8"))
          champ = json.loads(champion_path.read_text(encoding="utf-8"))
          replay = json.loads(replay_path.read_text(encoding="utf-8")) if replay_path.exists() else {}
          draws = pd.read_csv("data/numbers3.csv")
          match = re.search(r"(\d+)", str(draws.iloc[-1]["回別"]))
          latest_issue = int(match.group(1)) if match else old.get("last_issue")
          new = {
              "total_cycles": int(old.get("total_cycles", 0)) + 1,
              "last_completed_at": eng.get("last_completed_at"),
              "last_issue": latest_issue,
              "mode": "evolution_engine_v2_full_replay_feedback",
              "last_experiment_id": eng.get("last_experiment_id"),
              "current_champion_id": champ.get("champion_id"),
              "current_generation": champ.get("generation"),
              "replay_selection_exact_nll": (replay.get("selection") or {}).get("exact_nll"),
              "replay_best_selection_exact_nll": replay.get("best_selection_exact_nll"),
              "replay_stagnation_count": replay.get("stagnation_count", 0),
          }
          old_path.write_text(json.dumps(new, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          }

          checkpoint() {
            git add -- \
              experiments \
              backtests/continuous_status.txt \
              backtests/champion_replay \
              state/evolution_champion.json \
              state/evolution_engine_state.json \
              state/champion_replay_state.json \
              state/continuous_backtest_state.json

            if ! git diff --cached --quiet; then
              git commit -m "chore(agent): checkpoint evolution and Champion replay"
              git pull --rebase origin main
              git push origin HEAD:main
            else
              git pull --rebase origin main
            fi

            if [ "${PROMOTION_PENDING}" -eq 1 ]; then
              gh workflow run numbers3-daily.yml --repo "${GITHUB_REPOSITORY}" --ref main
              echo "Dispatched daily prediction with the newly replayed Champion."
              PROMOTION_PENDING=0
            fi
          }

          git pull --rebase origin main
          restore_dataset
          replay_latest_champion

          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            BEFORE_CHAMPION=$(champion_id)
            echo "[evolution] starting experiment $((CYCLES_THIS_RUN + 1)) at $(date -Iseconds) champion=${BEFORE_CHAMPION}"

            # Historical replay feedback widens the mutation search after stagnation.
            python numbers3_evolution_feedback.py \
              --csv data/numbers3.csv \
              --champion state/evolution_champion.json \
              --engine-state state/evolution_engine_state.json \
              --history experiments/experiment_history.csv \
              --latest experiments/latest_experiment.txt \
              --audit-draws 1000 \
              --fold-size 500

            update_compatibility_status
            AFTER_CHAMPION=$(champion_id)
            CYCLES_THIS_RUN=$((CYCLES_THIS_RUN + 1))
            NOW=$(date +%s)

            if [ "${BEFORE_CHAMPION}" != "${AFTER_CHAMPION}" ]; then
              echo "[evolution] Champion promoted: ${BEFORE_CHAMPION} -> ${AFTER_CHAMPION}"
              # Every model update immediately re-predicts the complete causal history.
              replay_latest_champion
              update_compatibility_status
              PROMOTION_PENDING=1
              checkpoint
              restore_dataset
              replay_latest_champion
              LAST_CHECKPOINT=${NOW}
              continue
            fi

            # The first experiment is always published immediately so a new deployment
            # can be verified without waiting for the normal 30 minute checkpoint.
            if [ "${CYCLES_THIS_RUN}" -eq 1 ]; then
              checkpoint
              restore_dataset
              replay_latest_champion
              LAST_CHECKPOINT=${NOW}
              continue
            fi

            if [ $((NOW - LAST_CHECKPOINT)) -ge 1800 ]; then
              checkpoint
              restore_dataset
              # If a new draw entered the dataset, refresh the current Champion replay.
              replay_latest_champion
              LAST_CHECKPOINT=${NOW}
            fi
          done

          checkpoint
          echo "[evolution] completed ${CYCLES_THIS_RUN} experiments in this workflow run"

      - name: Start next evolution run immediately
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run numbers3-continuous-backtest.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
          echo "Queued the next continuous evolution workflow run."

name: NUMBERS3 Daily Prediction

on:
  push:
    branches: [main]
    paths:
      - numbers3_historical_backtest.py
      - numbers3_runner.py
      - numbers3_evo_agent.py
      - .github/workflows/numbers3-daily.yml
  schedule:
    # GitHub Actions cron is UTC.
    # 11:00 UTC = 20:00 JST. Sunday(0) through Thursday(4).
    - cron: "0 11 * * 0-4"
  workflow_dispatch:

concurrency:
  group: numbers3-daily-prediction
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore historical dataset
        run: |
          cat data/history_parts/part_* > /tmp/numbers3.csv.xz.b64
          base64 -d /tmp/numbers3.csv.xz.b64 > /tmp/numbers3.csv.xz
          xz -dc /tmp/numbers3.csv.xz > data/numbers3.csv

      - name: Refresh, backtest, predict, and reconcile
        env:
          TZ: Asia/Tokyo
        run: |
          python numbers3_runner.py \
            --csv data/numbers3.csv \
            --scraper scrapingnumbers3.py \
            --refresh \
            --validation 1000 \
            --topk 20

      - name: Historical walk-forward accuracy audit
        env:
          TZ: Asia/Tokyo
        shell: bash
        run: |
          EXTRA=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            EXTRA="--force"
          fi
          python numbers3_historical_backtest.py \
            --csv data/numbers3.csv \
            --output-dir backtests \
            --warmup 500 \
            --refit-interval 1000 \
            --topk 20 \
            ${EXTRA}

      - name: Repack historical dataset
        run: |
          xz -9e -c data/numbers3.csv > /tmp/numbers3.csv.xz
          base64 /tmp/numbers3.csv.xz > /tmp/numbers3.csv.xz.b64
          rm -f data/history_parts/part_*
          split -b 8000 -d -a 2 /tmp/numbers3.csv.xz.b64 data/history_parts/part_

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "numbers3-ai-agent"
          git config user.email "numbers3-ai-agent@users.noreply.github.com"
          git add -- \
            data/history_parts \
            predictions \
            backtests \
            state
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore(agent): update NUMBERS3 prediction and backtest"
          git push
